<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChocoHub Mini Miner</title>
</head>
<body>
    <h1>ChocoHub Mini Miner</h1>

    <p>
        Hashrate: <strong id="hashrateValue">0 H/s</strong><br>
        Total hashes: <strong id="totalHashesValue">0</strong><br>
        Session time: <strong id="uptimeValue">0s</strong>
    </p>

    <h2>Current job</h2>
    <p>
        Job: <span id="jobId">No active job</span><br>
        Reward: <span id="rewardBadge">&mdash; CC</span><br>
        Difficulty: <span id="difficultyValue">&mdash;</span>
    </p>

    <p><progress id="progressFill" value="0" max="100"></progress></p>

    <p>
        <button id="startBtn" type="button">&#9654; Start Mining</button>
        <button id="stopBtn" type="button" disabled>&#9724; Stop</button>
    </p>

    <p>
        <label for="nodeSelect">Mining node:</label>
        <select id="nodeSelect">
            <option value="auto">Auto (Best Ping)</option>
        </select>
        <span id="nodeStatus">Detecting node...</span>
    </p>

    <h2>Console</h2>
    <pre id="console">&gt; Ready. Waiting for job...</pre>

    <h2>Originally made by Sunnystew</h2>

    <div id="toast"></div>

<script>
(function() {
    'use strict';

    var workerName = null;
    try { workerName = localStorage.getItem('choco_user'); } catch (e) {}

    var startBtn = document.getElementById('startBtn');
    var stopBtn = document.getElementById('stopBtn');
    var hashrateSpan = document.getElementById('hashrateValue');
    var totalHashesSpan = document.getElementById('totalHashesValue');
    var uptimeSpan = document.getElementById('uptimeValue');
    var jobIdSpan = document.getElementById('jobId');
    var rewardSpan = document.getElementById('rewardBadge');
    var difficultySpan = document.getElementById('difficultyValue');
    var progressFill = document.getElementById('progressFill');
    var consoleDiv = document.getElementById('console');
    var toastDiv = document.getElementById('toast');
    var nodeSelectEl = document.getElementById('nodeSelect');
    var nodeStatusEl = document.getElementById('nodeStatus');

    function log(msg, type) {
        var line = document.createElement('div');
        line.textContent = '[' + (type || 'info') + '] ' + msg;
        consoleDiv.appendChild(line);
        while (consoleDiv.children.length > 100) consoleDiv.removeChild(consoleDiv.firstChild);
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    var toastTimer = null;
    function showToast(msg) {
        toastDiv.textContent = msg;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { toastDiv.textContent = ''; }, 3500);
    }

    function formatHashrate(hps) {
        if (hps >= 1e6) return (hps / 1e6).toFixed(2) + ' MH/s';
        if (hps >= 1e3) return (hps / 1e3).toFixed(2) + ' kH/s';
        return hps.toFixed(1) + ' H/s';
    }

    function formatNumber(n) {
        if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
        if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
        return '' + n;
    }

    if (!workerName) {
        log('Not logged in. Please log in to start mining.', 'warn');
        startBtn.disabled = true;
        stopBtn.disabled = true;
        return;
    }

    var miningActive = false;
    var autoMineEnabled = false;
    var currentJob = null;
    var totalHashes = 0;
    var sessionStart = null;
    var hashrateInterval = null;
    var currentHashCount = 0;
    var lastTimestamp = Date.now();
    var currentHashrate = 0;
    var worker = null;

    var instanceId = null;
    try { instanceId = localStorage.getItem('choco_instance_id'); } catch (e) {}
    if (!instanceId) {
        instanceId = Math.random().toString(36).substring(2, 10);
        try { localStorage.setItem('choco_instance_id', instanceId); } catch (e) {}
    }
    var effectiveWorker = workerName + ':' + instanceId;
    var deviceType = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        || window.innerWidth < 768 ? 'mobile' : 'cpu';

    var currentServer = '';
    var selectedNode = null;
    var discoveredNodes = [];
    var ccNodeMode = 'auto';
    var heartbeatInterval = null;

    function formatNodeLabel(node, ms) {
        var ping;
        if (ms === undefined) {
            ping = (node.reachable && node.latency !== Infinity) ? node.latency + 'ms' : '?';
        } else {
            ping = (ms === null) ? 'timeout' : ms + 'ms';
        }
        return node.name + ' (' + node.location + ') - ' + ping;
    }

    function rebuildNodeOptions() {
        var prev = ccNodeMode === 'auto' ? 'auto' : String(ccNodeMode);
        while (nodeSelectEl.firstChild) nodeSelectEl.removeChild(nodeSelectEl.firstChild);
        var autoOpt = document.createElement('option');
        autoOpt.value = 'auto';
        autoOpt.textContent = 'Auto (Best Ping)';
        nodeSelectEl.appendChild(autoOpt);
        discoveredNodes.forEach(function(node) {
            var opt = document.createElement('option');
            opt.value = String(node.id);
            opt.textContent = formatNodeLabel(node);
            nodeSelectEl.appendChild(opt);
        });
        nodeSelectEl.value = prev;
        if (nodeSelectEl.selectedIndex === -1) nodeSelectEl.value = 'auto';
    }

    function setActiveCcNode(node, ms) {
        selectedNode = node;
        currentServer = '/api/proxy';
        nodeStatusEl.textContent = node.name +
            (ms !== null && ms !== undefined && ms !== Infinity ? ' - ' + ms + 'ms' : '');
        nodeSelectEl.value = String(node.id);
    }

    async function discoverBestNode() {
        try {
            var resp = await fetch('/api/nodes/discover');
            var data = await resp.json();
            if (!data || data.status !== 'success' || !data.nodes || data.nodes.length === 0) {
                discoveredNodes = [];
                rebuildNodeOptions();
                log('No mining nodes found. Using direct connection.', 'info');
                currentServer = '';
                selectedNode = null;
                nodeStatusEl.textContent = 'Direct connection';
                return;
            }
            log('Found ' + data.nodes.length + ' node(s).', 'info');
            discoveredNodes = data.nodes;
            rebuildNodeOptions();

            if (ccNodeMode !== 'auto') {
                var manualNode = null;
                for (var i = 0; i < discoveredNodes.length; i++) {
                    if (String(discoveredNodes[i].id) === String(ccNodeMode)) { manualNode = discoveredNodes[i]; break; }
                }
                if (manualNode) {
                    setActiveCcNode(manualNode, manualNode.latency);
                    log('Connected to: ' + manualNode.name + ' (' + manualNode.location + ')', 'info');
                    return;
                }
                ccNodeMode = 'auto';
            }

            var reachable = discoveredNodes.filter(function(n) { return n.reachable && n.latency !== Infinity; });
            if (reachable.length === 0) {
                log('All nodes unreachable. Using direct connection.', 'warn');
                currentServer = '';
                selectedNode = null;
                nodeStatusEl.textContent = 'All nodes unreachable';
                return;
            }

            setActiveCcNode(reachable[0], reachable[0].latency); // already sorted by latency
            log('Connected to: ' + reachable[0].name + ' (' + reachable[0].location + ') - ' + reachable[0].latency + 'ms', 'info');
        } catch (e) {
            log('Node discovery failed: ' + e.message + '. Using direct connection.', 'warn');
            currentServer = '';
            selectedNode = null;
            nodeStatusEl.textContent = 'Direct connection';
        }
    }

    function pingNode(node, timeoutMs) {
        return new Promise(function(resolve) {
            var start = performance.now ? performance.now() : Date.now();
            var done = false;
            var finish = function(ms) {
                if (done) return;
                done = true;
                resolve(ms);
            };
            var timer = setTimeout(function() { finish(null); }, timeoutMs || 6000);
            fetch(node.url, { mode: 'no-cors', cache: 'no-store' })
                .then(function() {
                    clearTimeout(timer);
                    finish(Math.round((performance.now ? performance.now() : Date.now()) - start));
                })
                .catch(function() { clearTimeout(timer); finish(null); });
        });
    }

    async function refreshCcNodes() {
        if (discoveredNodes.length === 0) return;
        nodeStatusEl.textContent = 'Pinging nodes...';

        var results = await Promise.all(discoveredNodes.map(async function(node) {
            var ms = await pingNode(node);
            var opt = nodeSelectEl.querySelector('option[value="' + node.id + '"]');
            if (opt) opt.textContent = formatNodeLabel(node, ms);
            return { node: node, ms: ms };
        }));

        var reachable = results.filter(function(r) { return r.ms !== null; })
            .sort(function(a, b) { return a.ms - b.ms; });

        if (ccNodeMode === 'auto') {
            if (reachable.length > 0) {
                setActiveCcNode(reachable[0].node, reachable[0].ms);
                log('Node ping: ' + reachable[0].node.name + ' (' + reachable[0].node.location + ') - ' + reachable[0].ms + 'ms (lowest ping)', 'info');
            } else {
                selectedNode = null;
                currentServer = '';
                nodeStatusEl.textContent = 'All nodes unreachable';
                log('Node ping: all mining nodes unreachable.', 'warn');
            }
        } else {
            for (var i = 0; i < results.length; i++) {
                if (String(results[i].node.id) === String(ccNodeMode)) {
                    setActiveCcNode(results[i].node, results[i].ms);
                    break;
                }
            }
        }
    }

    async function selectCcNode(id) {
        ccNodeMode = id;
        if (id === 'auto') {
            log('Switched to Auto (Best Ping) mode.', 'info');
            await discoverBestNode();
        } else {
            for (var i = 0; i < discoveredNodes.length; i++) {
                if (String(discoveredNodes[i].id) === String(id)) {
                    selectedNode = discoveredNodes[i];
                    currentServer = '/api/proxy';
                    nodeStatusEl.textContent = selectedNode.name;
                    log('Manually selected node: ' + selectedNode.name + ' (' + selectedNode.location + ')', 'info');
                    break;
                }
            }
        }
        refreshCcNodes();
    }

    nodeSelectEl.addEventListener('change', function() { selectCcNode(nodeSelectEl.value); });

    function startHeartbeat() {
        stopHeartbeat();
        heartbeatInterval = setInterval(async function() {
            if (!selectedNode) return;
            try {
                await fetch('/api/proxy/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ node_id: selectedNode.id, miners: 1 })
                });
            } catch (e) { /* silent */ }
        }, 15000);
    }
    function stopHeartbeat() {
        if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    }

    function updateUI() {
        totalHashesSpan.textContent = formatNumber(totalHashes);
        hashrateSpan.textContent = formatHashrate(currentHashrate);
        if (sessionStart) {
            uptimeSpan.textContent = Math.floor((Date.now() - sessionStart) / 1000) + 's';
        } else {
            uptimeSpan.textContent = '0s';
        }
    }

    function startHashrateTracker() {
        if (hashrateInterval) clearInterval(hashrateInterval);
        currentHashCount = 0;
        lastTimestamp = Date.now();
        hashrateInterval = setInterval(function() {
            var now = Date.now();
            var delta = (now - lastTimestamp) / 1000;
            if (delta >= 1) {
                currentHashrate = currentHashCount / delta;
                currentHashCount = 0;
                lastTimestamp = now;
                updateUI();
            }
        }, 1000);
    }

    async function fetchNewJob() {
        try {
            var body = { worker_name: workerName, instance_id: instanceId, device_type: deviceType };
            if (currentServer === '/api/proxy' && selectedNode) {
                body.node_id = selectedNode.id;
            }
            var url = currentServer === '/api/proxy' ? '/api/proxy/get_job' : currentServer + '/get_job';
            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var job = await res.json();
            if (!job || !(job.bounty_id || job.job_id)) {
                throw new Error('Invalid job response (missing id)');
            }
            return job;
        } catch (err) {
            log('Failed to fetch job: ' + err.message, 'err');
            return null;
        }
    }

    async function startMiningWithJob(job) {
        if (!job) return false;
        currentJob = job;

        var jobId = job.bounty_id || job.job_id;
        jobIdSpan.textContent = jobId.substring(0, 12) + '...';
        var reward = (job.reward !== undefined && job.reward !== null) ? parseFloat(job.reward).toFixed(4) : '?';
        rewardSpan.textContent = reward + ' CC';
        difficultySpan.textContent = job.difficulty || '?';
        progressFill.value = 0;
        if (!worker) {
            worker = new Worker('/static/js/cpu.js');
            worker.onmessage = handleWorkerMessage;
            worker.onerror = function(e) { log('Worker error: ' + e.message, 'err'); };
        }

        worker.postMessage({
            type: 'start',
            bounty_id: job.bounty_id,
            job_id: job.job_id,
            last_hash: job.last_hash,
            prev_hash: job.prev_hash,
            target_hex: job.target_hex || job.targetHex,
            difficulty: job.difficulty,
            reward: job.reward,
            username: effectiveWorker,
            worker_name: effectiveWorker
        });

        miningActive = true;
        totalHashes = 0;
        sessionStart = Date.now();
        currentHashCount = 0;
        currentHashrate = 0;
        startHashrateTracker();
        updateUI();

        log('Mining job #' + jobId.substring(0, 10) + '... | diff: ' + job.difficulty + ' | reward: ' + reward + ' CC', 'info');
        return true;
    }

    function stopMiningProcess(keepJob) {
        if (worker && miningActive) {
            worker.postMessage({ type: 'stop' });
        }
        miningActive = false;
        if (hashrateInterval) clearInterval(hashrateInterval);
        hashrateInterval = null;
        if (!keepJob) {
            currentJob = null;
            jobIdSpan.textContent = 'No active job';
            rewardSpan.textContent = '\u2014 CC';
            difficultySpan.textContent = '\u2014';
            progressFill.value = 0;
        }
        updateUI();
    }

    function handleWorkerMessage(e) {
        var data = e.data;
        switch (data.type) {
            case 'ready':
                log('Worker ready', 'info');
                break;
            case 'debug':
                log('[Worker] ' + data.message, 'info');
                break;
            case 'job_ready':
                log('[Worker] Job loaded: ' + (data.job_id || '').substring(0, 12) + '...', 'info');
                break;
            case 'progress':
                var newHashes = data.hashes || 0;
                totalHashes += newHashes;
                currentHashCount += newHashes;
                updateUI();
                var targetTotal = (currentJob && currentJob.difficulty) ? parseInt(currentJob.difficulty, 10) : 50000;
                progressFill.value = Math.min(95, (totalHashes / targetTotal) * 100);
                break;
            case 'found':
                log('Nonce found: ' + data.nonce, 'win');
                progressFill.value = 100;
                miningActive = false;
                if (worker) worker.postMessage({ type: 'stop' });
                var jobId = data.job_id || data.bounty_id;
                if (jobId) {
                    submitSolution(jobId, data.nonce, workerName, instanceId);
                } else {
                    log('No job id in found message', 'err');
                }
                break;
            case 'error':
                log('[Worker] ' + (data.message || 'unknown error'), 'err');
                break;
            default:
                break;
        }
    }

    async function submitSolution(jobId, nonce, wName, instId) {
        log('Submitting solution for #' + jobId.substring(0, 8) + '...', 'info');
        try {
            var body = {
                bounty_id: jobId,
                nonce: nonce,
                worker_name: wName,
                instance_id: instId,
                device_type: deviceType
            };
            if (currentServer === '/api/proxy' && selectedNode) {
                body.node_id = selectedNode.id;
            }
            var url = currentServer === '/api/proxy' ? '/api/proxy/submit_solution' : currentServer + '/submit_solution';
            var res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            var result = await res.json();
            if (res.ok && result.status === 'success') {
                var reward = result.reward || '?';
                log('BLOCK SOLVED! +' + reward + ' CC', 'win');
                showToast('+' + reward + ' CC earned!');
                if (autoMineEnabled) {
                    setTimeout(startMiningLoop, 2000);
                } else {
                    stopMiningProcess(true);
                    startBtn.textContent = '\u25B6 Start Mining';
                    stopBtn.disabled = true;
                }
            } else {
                log('Submission rejected: ' + (result.reason || result.message || 'unknown'), 'err');
                showToast('Solution rejected');
                if (autoMineEnabled) {
                    setTimeout(startMiningLoop, 3000);
                }
            }
        } catch (err) {
            log('Submission error: ' + err.message, 'err');
            if (autoMineEnabled) {
                setTimeout(startMiningLoop, 5000);
            }
        }
    }

    async function startMiningLoop() {
        if (!autoMineEnabled) return;
        stopMiningProcess(true);
        var job = await fetchNewJob();
        if (!job) {
            log('No job available, retrying in 5s...', 'warn');
            setTimeout(startMiningLoop, 5000);
            return;
        }
        var ok = await startMiningWithJob(job);
        if (!ok) {
            setTimeout(startMiningLoop, 3000);
        } else {
            startBtn.textContent = '\u23F8 Pause';
            stopBtn.disabled = false;
        }
    }

    function onStart() {
        if (miningActive) {
            autoMineEnabled = false;
            stopMiningProcess(true);
            startBtn.textContent = '\u25B6 Start Mining';
            stopBtn.disabled = true;
            log('Mining paused.', 'info');
        } else {
            autoMineEnabled = true;
            startBtn.textContent = '\u23F8 Pause';
            stopBtn.disabled = false;
            log('Starting mining...', 'info');
            startHeartbeat();
            startMiningLoop();
        }
    }

    function onStop() {
        autoMineEnabled = false;
        stopMiningProcess(false);
        stopHeartbeat();
        startBtn.textContent = '\u25B6 Start Mining';
        stopBtn.disabled = true;
        log('Miner stopped completely.', 'warn');
    }

    startBtn.addEventListener('click', onStart);
    stopBtn.addEventListener('click', onStop);
    log('Logged in as: ' + workerName, 'info');

    discoverBestNode().then(function() {
        return refreshCcNodes();
    }).then(function() {
        setTimeout(function() {
            autoMineEnabled = true;
            startMiningLoop();
        }, 1000);
    });
})();
</script>
</body>
</html>
