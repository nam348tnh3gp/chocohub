name: Build Node.js 21 for Android aarch64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Node.js source
        run: |
          git clone --branch v21.7.3 --depth 1 https://github.com/nodejs/node.git
          cd node

      - name: Setup Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip android-ndk-r26c-linux.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26c

      - name: Configure for Android aarch64
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd node
          ./configure \
            --dest-cpu=arm64 \
            --dest-os=android \
            --cross-compiling \
            --with-intl=system-icu \
            --without-snapshot \
            --prefix=/usr/local \
            --without-npm \
            --without-inspector \
            --disable-dtrace

      - name: Build
        run: |
          cd node
          make -j$(nproc)

      - name: Package binary
        run: |
          cd node/out/Release
          patchelf --set-interpreter /system/bin/linker64 node
          tar -czf node-v21-android-arm64.tar.gz node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-v21-android-arm64
          path: node/out/Release/node-v21-android-arm64.tar.gz