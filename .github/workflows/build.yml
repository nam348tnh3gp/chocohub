name: Build Node.js 21 for Android aarch64

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to build'
        required: true
        default: 'v21.7.3'
      ndk_version:
        description: 'Android NDK version'
        required: true
        default: 'r26c'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout Node.js source
        uses: actions/checkout@v4
        with:
          repository: nodejs/node
          ref: ${{ github.event.inputs.node_version || 'v21.7.3' }}
          path: node
          fetch-depth: 1

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-*
          key: ${{ runner.os }}-ndk-${{ github.event.inputs.ndk_version || 'r26c' }}

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_VERSION=${{ github.event.inputs.ndk_version || 'r26c' }}
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          rm android-ndk-${NDK_VERSION}-linux.zip

      - name: Setup environment
        run: |
          NDK_VERSION=${{ github.event.inputs.ndk_version || 'r26c' }}
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          echo "$PWD/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            patchelf \
            ninja-build \
            pkg-config

      - name: Configure for Android aarch64
        working-directory: node
        run: |
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export LD=ld.lld
          export STRIP=llvm-strip
          export CFLAGS="-D__ANDROID_API__=21"
          export CXXFLAGS="-D__ANDROID_API__=21"
          export GYP_DEFINES="android_ndk_path=$ANDROID_NDK_HOME target_arch=arm64 host_os=linux"
          
          # Use the official android-configure script for cross-compilation
          source android-configure "$ANDROID_NDK_HOME" arm64
          
          # Additional configure options for a minimal, portable build
          ./configure \
            --dest-cpu=arm64 \
            --dest-os=android \
            --cross-compiling \
            --without-inspector \
            --without-npm \
            --prefix=/usr/local \
            --shared \
            --with-intl=system-icu \
            --openssl-no-asm

      - name: Build
        working-directory: node
        run: |
          # Build with all available cores
          make -j$(nproc)
          
          # Verify the build
          if [ ! -f out/Release/node ]; then
            echo "Build failed: node binary not found"
            exit 1
          fi

      - name: Package binary
        working-directory: node/out/Release
        run: |
          # Set the correct Android interpreter
          patchelf --set-interpreter /system/bin/linker64 node
          
          # Create a tarball with the binary
          tar -czf node-android-arm64.tar.gz node
          
          # Generate checksum for verification
          sha256sum node-android-arm64.tar.gz > node-android-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-android-arm64
          path: |
            node/out/Release/node-android-arm64.tar.gz
            node/out/Release/node-android-arm64.tar.gz.sha256
          retention-days: 30

      - name: Test binary (optional)
        if: always()
        working-directory: node/out/Release
        run: |
          # Quick test to verify the binary works
          ./node --version || echo "Binary test failed (expected on non-Android runner)"