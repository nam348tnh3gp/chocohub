name: Build Node.js 21 for Android aarch64

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: true
        default: 'v21.7.3'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Node.js source
        uses: actions/checkout@v4
        with:
          repository: nodejs/node
          ref: ${{ github.event.inputs.node_version || 'v21.7.3' }}
          path: node
          fetch-depth: 1

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r26c
          key: ${{ runner.os }}-ndk-r26c

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          rm android-ndk-r26c-linux.zip

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 patchelf ninja-build pkg-config

      - name: Patch c-ares and V8 for Android compatibility
        working-directory: node
        run: |
          # --- c-ares patches ---
          # Tắt getifaddrs/freeifaddrs trong config
          sed -i 's/#define HAVE_GETIFADDRS 1/#undef HAVE_GETIFADDRS/g' deps/cares/config/android/ares_config.h
          sed -i 's/#define HAVE_FREEIFADDRS 1/#undef HAVE_FREEIFADDRS/g' deps/cares/config/android/ares_config.h
          # Sửa file nguồn để bỏ qua getifaddrs
          sed -i 's/if (getifaddrs(&ifap) != 0) {/if (1) { \/\/ Disable getifaddrs for Android/g' deps/cares/src/lib/ares__iface_ips.c
          sed -i 's/freeifaddrs(ifap);/\/\/ freeifaddrs not available on Android/g' deps/cares/src/lib/ares__iface_ips.c

          # --- V8 backtrace patch ---
          # Thêm định nghĩa NO_BACKTRACE vào đầu file stack_trace_posix.cc khi build cho Android
          sed -i '1i#ifdef ANDROID\n#define NO_BACKTRACE\n#endif' deps/v8/src/base/debug/stack_trace_posix.cc

      - name: Configure for Android aarch64
        working-directory: node
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${{ env.ANDROID_NDK_HOME }}"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export CFLAGS="-D__ANDROID_API__=21 -DANDROID -D__ANDROID__"
          export CXXFLAGS="-D__ANDROID_API__=21 -DANDROID -D__ANDROID__ -DNO_BACKTRACE"
          export GYP_DEFINES="android_ndk_path=$ANDROID_NDK_HOME target_arch=arm64 host_os=linux OS=android v8_no_backtrace=1"

          ./configure \
            --dest-cpu=arm64 \
            --dest-os=android \
            --cross-compiling \
            --without-inspector \
            --without-npm \
            --prefix=/usr/local \
            --shared \
            --with-intl=small-icu \
            --openssl-no-asm

      - name: Build
        working-directory: node
        run: |
          make -j$(nproc)
          test -f out/Release/node || (echo "Build failed" && exit 1)

      - name: Package binary
        working-directory: node/out/Release
        run: |
          patchelf --set-interpreter /system/bin/linker64 node
          tar -czf node-android-arm64.tar.gz node
          sha256sum node-android-arm64.tar.gz > node-android-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-android-arm64
          path: |
            node/out/Release/node-android-arm64.tar.gz
            node/out/Release/node-android-arm64.tar.gz.sha256
          retention-days: 30