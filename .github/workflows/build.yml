name: Build Node.js 21 for Android aarch64

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: true
        default: 'v21.7.3'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Node.js source
        uses: actions/checkout@v4
        with:
          repository: nodejs/node
          ref: ${{ github.event.inputs.node_version || 'v21.7.3' }}
          path: node
          fetch-depth: 1

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r26c
          key: ${{ runner.os }}-ndk-r26c

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          rm android-ndk-r26c-linux.zip

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 patchelf ninja-build pkg-config

      - name: Fix c-ares config for Android
        working-directory: node
        run: |
          # Ghi đè file ares_config.h để tắt getifaddrs/freeifaddrs
          cat > deps/cares/config/android/ares_config.h << 'EOF'
          /* ares_config.h for Android */
          #define HAVE_GETIFADDRS 0
          #define HAVE_FREEIFADDRS 0
          #define HAVE_STRUCT_IFREQ 0
          #define HAVE_STRUCT_IN6_ADDR 1
          #define HAVE_STRUCT_SOCKADDR_IN6 1
          #define HAVE_STRUCT_ADDRINFO 1
          #define HAVE_GETNAMEINFO 1
          #define HAVE_GETSERVBYPORT_R 0
          #define HAVE_GETSERVBYPORT 1
          #define HAVE_GETHOSTBYNAME_R 0
          #define HAVE_GETHOSTBYNAME 1
          #define HAVE_GETHOSTBYADDR 1
          #define HAVE_GETADDRINFO 1
          #define HAVE_FREEADDRINFO 1
          #define HAVE_GETENV 1
          #define HAVE_SETJMP_H 1
          #define HAVE_SIGACTION 1
          #define HAVE_SYS_IOCTL_H 1
          #define HAVE_SYS_SELECT_H 1
          #define HAVE_SYS_SOCKET_H 1
          #define HAVE_SYS_TIME_H 1
          #define HAVE_SYS_TYPES_H 1
          #define HAVE_TIME_H 1
          #define HAVE_UNISTD_H 1
          #define HAVE_STRINGS_H 1
          #define HAVE_STDLIB_H 1
          #define HAVE_STDIO_H 1
          #define HAVE_STRING_H 1
          #define HAVE_STDINT_H 1
          #define HAVE_INTTYPES_H 1
          #define HAVE_SYS_PARAM_H 1
          #define HAVE_NETINET_IN_H 1
          #define HAVE_ARPA_NAMESER_H 1
          #define HAVE_ARPA_NAMESER_COMPAT_H 1
          #define HAVE_ARPA_INET_H 1
          #define HAVE_AF_INET6 1
          #define HAVE_PF_INET6 1
          #define HAVE_SOCKADDR_IN6_SIN6_SCOPE_ID 1
          #define HAVE_IPV6 1
          #define HAVE_CLOCK_GETTIME_MONOTONIC 1
          #define HAVE_PTHREAD_H 1
          #define HAVE_PTHREAD_MUTEX_LOCK 1
          #define HAVE_PTHREAD_MUTEX_TRYLOCK 1
          #define HAVE_PTHREAD_MUTEX_INIT 1
          #define HAVE_PTHREAD_COND_INIT 1
          #define HAVE_PTHREAD_COND_WAIT 1
          #define HAVE_PTHREAD_COND_SIGNAL 1
          #define HAVE_PTHREAD_COND_BROADCAST 1
          #define HAVE_PTHREAD_COND_DESTROY 1
          #define HAVE_PTHREAD_CREATE 1
          #define HAVE_PTHREAD_JOIN 1
          #define HAVE_PTHREAD_DETACH 1
          #define HAVE_PTHREAD_ATTR_INIT 1
          #define HAVE_PTHREAD_ATTR_DESTROY 1
          #define HAVE_PTHREAD_ATTR_SETDETACHSTATE 1
          #define HAVE_PTHREAD_ATTR_GETDETACHSTATE 1
          #define HAVE_PTHREAD_GETCPUCLOCKID 0
          #define HAVE_PTHREAD_SETNAME_NP 0
          #define HAVE_PTHREAD_SET_NAME_NP 0
          #define HAVE_PTHREAD_SETNAME_NP_WITH_TID 0
          #define HAVE_PTHREAD_GETNAME_NP 0
          #define HAVE_PTHREAD_GET_NAME_NP 0
          #define HAVE_PTHREAD_GETNAME_NP_WITH_TID 0
          #define HAVE_PTHREAD_KEY_DELETE 0
          #define HAVE_PTHREAD_KEY_CREATE 0
          #define HAVE_PTHREAD_SETSpecific 0
          #define HAVE_PTHREAD_GETSPECIFIC 0
          #define HAVE_PTHREAD_MUTEX_RECURSIVE 0
          #define HAVE_PTHREAD_MUTEX_ERRORCHECK 0
          #define HAVE_PTHREAD_MUTEX_ADAPTIVE_NP 0
          #define HAVE_PTHREAD_MUTEX_TIMEDLOCK 0
          #define HAVE_PTHREAD_MUTEXATTR_INIT 0
          #define HAVE_PTHREAD_MUTEXATTR_DESTROY 0
          #define HAVE_PTHREAD_MUTEXATTR_SETTYPE 0
          #define HAVE_PTHREAD_MUTEXATTR_GETTYPE 0
          #define HAVE_PTHREAD_MUTEXATTR_SETROBUST 0
          #define HAVE_PTHREAD_MUTEXATTR_GETROBUST 0
          #define HAVE_PTHREAD_MUTEX_ROBUST 0
          #define HAVE_PTHREAD_MUTEX_STALLED 0
          #define HAVE_PTHREAD_MUTEX_OWNER 0
          #define HAVE_PTHREAD_MUTEX_TYPE 0
          #define HAVE_PTHREAD_MUTEX_PROTOCOL 0
          #define HAVE_PTHREAD_MUTEX_PRIOCEILING 0
          #define HAVE_PTHREAD_MUTEX_PRIO_INHERIT 0
          #define HAVE_PTHREAD_MUTEX_PRIO_PROTECT 0
          #define HAVE_PTHREAD_MUTEX_PRIO_NONE 0
          #define HAVE_PTHREAD_RWLOCK_INIT 0
          #define HAVE_PTHREAD_RWLOCK_DESTROY 0
          #define HAVE_PTHREAD_RWLOCK_RDLOCK 0
          #define HAVE_PTHREAD_RWLOCK_WRLOCK 0
          #define HAVE_PTHREAD_RWLOCK_UNLOCK 0
          #define HAVE_PTHREAD_RWLOCKATTR_INIT 0
          #define HAVE_PTHREAD_RWLOCKATTR_DESTROY 0
          #define HAVE_PTHREAD_RWLOCKATTR_SETKIND_NP 0
          #define HAVE_PTHREAD_RWLOCKATTR_GETKIND_NP 0
          #define HAVE_PTHREAD_SPIN_INIT 0
          #define HAVE_PTHREAD_SPIN_DESTROY 0
          #define HAVE_PTHREAD_SPIN_LOCK 0
          #define HAVE_PTHREAD_SPIN_UNLOCK 0
          #define HAVE_PTHREAD_SPIN_TRYLOCK 0
          #define HAVE_PTHREAD_BARRIER_INIT 0
          #define HAVE_PTHREAD_BARRIER_DESTROY 0
          #define HAVE_PTHREAD_BARRIER_WAIT 0
          #define HAVE_PTHREAD_BARRIER_ATTR_INIT 0
          #define HAVE_PTHREAD_BARRIER_ATTR_DESTROY 0
          #define HAVE_PTHREAD_BARRIER_ATTR_SETPSHARED 0
          #define HAVE_PTHREAD_BARRIER_ATTR_GETPSHARED 0
          #define HAVE_PTHREAD_CONDATTR_INIT 0
          #define HAVE_PTHREAD_CONDATTR_DESTROY 0
          #define HAVE_PTHREAD_CONDATTR_SETCLOCK 0
          #define HAVE_PTHREAD_CONDATTR_GETCLOCK 0
          #define HAVE_PTHREAD_CONDATTR_SETPSHARED 0
          #define HAVE_PTHREAD_CONDATTR_GETPSHARED 0
          #define HAVE_PTHREAD_COND_TIMEDWAIT 0
          #define HAVE_PTHREAD_COND_WAIT 0
          #define HAVE_PTHREAD_COND_SIGNAL 0
          #define HAVE_PTHREAD_COND_BROADCAST 0
          #define HAVE_PTHREAD_COND_DESTROY 0
          #define HAVE_PTHREAD_ONCE 0
          #define HAVE_PTHREAD_ONCE_INIT 0
          EOF

      - name: Configure for Android aarch64
        working-directory: node
        run: |
          export ANDROID_NDK_HOME="${{ env.ANDROID_NDK_HOME }}"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export CFLAGS="-D__ANDROID_API__=21"
          export CXXFLAGS="-D__ANDROID_API__=21"
          export GYP_DEFINES="android_ndk_path=$ANDROID_NDK_HOME target_arch=arm64 host_os=linux OS=android"

          ./configure \
            --dest-cpu=arm64 \
            --dest-os=android \
            --cross-compiling \
            --without-inspector \
            --without-npm \
            --prefix=/usr/local \
            --shared \
            --with-intl=small-icu \
            --openssl-no-asm

      - name: Build
        working-directory: node
        run: |
          make -j$(nproc)
          test -f out/Release/node || (echo "Build failed" && exit 1)

      - name: Package binary
        working-directory: node/out/Release
        run: |
          patchelf --set-interpreter /system/bin/linker64 node
          tar -czf node-android-arm64.tar.gz node
          sha256sum node-android-arm64.tar.gz > node-android-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-android-arm64
          path: |
            node/out/Release/node-android-arm64.tar.gz
            node/out/Release/node-android-arm64.tar.gz.sha256
          retention-days: 30