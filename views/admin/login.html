<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login · ChocoHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cocoa-950:#1c120c;
    --cocoa-900:#241610;
    --cocoa-800:#2e1c13;
    --cocoa-700:#3d2517;
    --caramel:#e0a458;
    --caramel-light:#f4c988;
    --cream:#fbf3e7;
    --white:#ffffff;
    --error:#ffb4a8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--cream);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:1.5rem;
    position:relative;
    overflow:hidden;
    background-color:var(--cocoa-950);
    background-image:
      linear-gradient(180deg, rgba(20,10,6,0.55) 0%, rgba(20,10,6,0.30) 40%, rgba(15,8,5,0.75) 100%),
      url('https://images.unsplash.com/photo-1757010230553-d801442437ae?fm=jpg&q=80&w=2400&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }

  /* soft vignette so the card always has contrast regardless of photo content */
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 45%, rgba(0,0,0,0) 0%, rgba(10,5,3,0.55) 100%);
    pointer-events:none;
  }

  .login-box{
    position:relative;
    z-index:1;
    width:100%;
    max-width:380px;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(22px) saturate(120%);
    -webkit-backdrop-filter:blur(22px) saturate(120%);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:28px;
    padding:2.75rem 2.25rem 2.25rem;
    box-shadow:
      0 30px 60px -15px rgba(0,0,0,0.6),
      0 0 0 1px rgba(0,0,0,0.2),
      inset 0 1px 0 rgba(255,255,255,0.08);
    text-align:center;
    transition:transform 0.35s ease, box-shadow 0.35s ease;
  }

  .login-box:hover{
    transform:translateY(-4px);
    box-shadow:
      0 40px 70px -15px rgba(0,0,0,0.65),
      0 0 0 1px rgba(0,0,0,0.2),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  /* --- Chocolate logo mark --- */
  .logo-mark{
    font-size:2.75rem;
    line-height:1;
    margin-bottom:1rem;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,0.5));
  }

  h1{
    font-family:'Fraunces', Georgia, serif;
    font-size:1.65rem;
    font-weight:600;
    font-optical-sizing:auto;
    letter-spacing:-0.01em;
    color:var(--white);
    margin-bottom:0.3rem;
  }

  .subtitle{
    font-size:0.8rem;
    color:rgba(251,243,231,0.55);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:2rem;
  }

  .input-group{
    margin-bottom:1.15rem;
    text-align:left;
  }

  .input-group label{
    display:block;
    margin-bottom:0.45rem;
    font-size:0.78rem;
    font-weight:600;
    color:rgba(251,243,231,0.65);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  input{
    width:100%;
    padding:13px 16px;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    color:var(--white);
    font-size:1rem;
    font-family:inherit;
    outline:none;
    transition:border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  input::placeholder{
    color:rgba(251,243,231,0.32);
  }

  input:focus{
    border-color:var(--caramel);
    background:rgba(0,0,0,0.35);
    box-shadow:0 0 0 3px rgba(224,164,88,0.18);
  }

  button{
    width:100%;
    margin-top:0.6rem;
    padding:13px 20px;
    background:linear-gradient(135deg, var(--caramel-light), var(--caramel));
    color:var(--cocoa-950);
    border:none;
    border-radius:14px;
    font-weight:700;
    font-size:0.98rem;
    letter-spacing:0.01em;
    cursor:pointer;
    transition:transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 10px 24px -8px rgba(224,164,88,0.5);
  }

  button:hover{
    transform:translateY(-1px);
    filter:brightness(1.06);
    box-shadow:0 14px 28px -8px rgba(224,164,88,0.6);
  }

  button:active{
    transform:translateY(0);
  }

  button:focus-visible,
  input:focus-visible{
    outline:2px solid var(--white);
    outline-offset:2px;
  }

  .error{
    min-height:1.1rem;
    margin-top:0.9rem;
    font-size:0.82rem;
    color:var(--error);
  }

  .footer{
    margin-top:1.6rem;
    padding-top:1.1rem;
    border-top:1px solid rgba(255,255,255,0.08);
    font-size:0.72rem;
    color:rgba(251,243,231,0.4);
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .login-box{ transition:none; }
    button{ transition:none; }
  }

  @media (max-width:420px){
    .login-box{ padding:2.25rem 1.5rem 1.75rem; border-radius:22px; }
  }
</style>
</head>
<body>

  <div class="login-box">
    <div class="logo-mark" aria-hidden="true">🍫</div>

    <h1>ChocoHub Admin</h1>
    <p class="subtitle">Staff Console</p>

    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="off">
      </div>
      <div class="input-group">
        <label for="pin">PIN</label>
        <input type="password" id="pin" name="pin" placeholder="Enter your PIN" required autocomplete="off" inputmode="numeric">
      </div>
      <button type="submit">Sign in</button>
      <div id="errorMsg" class="error" role="alert" aria-live="polite"></div>
    </form>

    <div class="footer">Secure session · HttpOnly cookie</div>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const pin = document.getElementById('pin').value;
    const errorEl = document.getElementById('errorMsg');
    errorEl.innerText = '';

    try {
      const resp = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, pin })
      });
      const data = await resp.json();
      if (resp.ok && data.status === 'success') {
        window.location.href = '/admin/dashboard';
      } else {
        errorEl.innerText = data.message || 'Authentication failed';
      }
    } catch (err) {
      errorEl.innerText = 'Network error';
    }
  });
</script>

</body>
</html>
